<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>last30days Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --sidebar: #050505;
      --surface: #101010;
      --surface-raised: #191919;
      --surface-hover: #242424;
      --border: rgba(154, 169, 199, .14);
      --border-strong: rgba(154, 169, 199, .23);
      --text: #edf1fb;
      --muted: #929db2;
      --subtle: #667187;
      --accent: #8c9cff;
      --accent-strong: #7185ff;
      --accent-soft: rgba(125, 143, 255, .13);
      --cyan: #69d6d0;
      --success: #62d6a1;
      --warning: #f0c875;
      --shadow: 0 24px 70px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
    body {
      min-height: 100vh; margin: 0; color: var(--text); background: #000000; font-size: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .55; }
    ::selection { color: #fff; background: rgba(113, 133, 255, .42); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #303030; border: 2px solid var(--bg); border-radius: 20px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4761; }
    .hidden { display: none !important; }

    .app-layout { display: flex; min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; display: flex; flex: 0 0 304px; flex-direction: column;
      width: 304px; height: 100vh; padding: 27px 20px 18px;
      background: linear-gradient(180deg, #070707, #000000);
      border-right: 1px solid var(--border); z-index: 5;
    }
    .brand-row { display: flex; align-items: center; gap: 12px; padding: 0 7px 22px; }
    .brand-mark {
      display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px;
      color: #fff; border: 1px solid rgba(151, 164, 255, .34); border-radius: 13px;
      background: linear-gradient(145deg, #6479f5 0%, #8c80f5 54%, #53b8c9 125%);
      box-shadow: 0 8px 24px rgba(98, 119, 248, .22);
    }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { color: var(--text); font-size: 16px; font-weight: 800; letter-spacing: -.65px; }
    .brand-name span { color: #a2adff; }
    #health { margin: -10px 7px 18px; color: var(--muted); font-size: 10px; line-height: 1.6; }
    #health.text-emerald-400 { color: var(--success) !important; }
    #health.text-amber-400 { color: var(--warning) !important; }
    .sidebar-label { margin: 7px 0 11px 2px; color: var(--subtle); font-size: 10px; font-weight: 700; letter-spacing: 1.35px; text-transform: uppercase; }
    .config-panel { padding: 17px 14px 14px; border: 1px solid var(--border); border-radius: 16px; background: rgba(18, 18, 18, .88); box-shadow: 0 10px 30px rgba(0, 0, 0, .12); }
    #topic, #mode {
      display: block; width: 100%; min-height: 43px; padding: 0 12px; color: var(--text);
      border: 1px solid var(--border-strong); border-radius: 10px; outline: none;
      background: #090909; font-size: 14px; transition: border-color .18s, box-shadow .18s, background .18s;
    }
    #topic::placeholder { color: #69758b; }
    #topic:focus, #mode:focus { border-color: rgba(137, 153, 255, .8); background: #151515; box-shadow: 0 0 0 3px rgba(125, 143, 255, .12); }
    #mode { margin-top: 10px; color: #d6ddef; cursor: pointer; }
    #mode option { color: var(--text); background: var(--surface); }
    #go {
      display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 43px; margin-top: 12px;
      color: #fff; border: 1px solid rgba(175, 185, 255, .3); border-radius: 10px;
      background: linear-gradient(110deg, #6579ed 0%, #7b78ed 58%, #668edb 100%);
      box-shadow: 0 7px 20px rgba(99, 119, 237, .2); font-size: 13px; font-weight: 700;
      transition: transform .18s, filter .18s, box-shadow .18s;
    }
    #go:hover { filter: brightness(1.09); transform: translateY(-1px); box-shadow: 0 10px 25px rgba(99, 119, 237, .29); }
    #go:active { transform: translateY(0); }
    #go svg { width: 15px; height: 15px; }
    .history-heading { display: flex; align-items: center; justify-content: space-between; margin: 25px 3px 9px; }
    .history-heading .sidebar-label { margin: 0; }
    .history-tools { display: flex; align-items: center; gap: 9px; }
    .history-count-label { color: #717171; font-size: 10px; font-weight: 650; letter-spacing: .45px; }
    .history-clear-button {
      display: inline-flex; align-items: center; gap: 5px; min-height: 27px; padding: 0 8px;
      color: #a2a2a2; border: 1px solid rgba(255,255,255,.09); border-radius: 7px;
      background: rgba(255,255,255,.035); font-size: 11px; font-weight: 600; transition: .18s ease;
    }
    .history-clear-button svg { width: 13px; height: 13px; }
    .history-clear-button:hover:not(:disabled) { color: #ff9da5; border-color: rgba(239,120,133,.28); background: rgba(160,53,68,.12); }
    .history-clear-button:disabled { cursor: default; opacity: .38; }
    .history-empty { padding: 13px 10px; color: #707070; font-size: 12px; line-height: 1.55; }
    #hist { flex: 1; min-height: 70px; overflow-y: auto; padding: 3px 1px 12px; }
    #hist a {
      display: block; margin: 3px 0; padding: 11px 12px; color: #c4ccdc;
      border: 1px solid transparent; border-radius: 10px; background: transparent;
      font-size: 13px; line-height: 1.55; text-decoration: none; transition: .16s ease;
    }
    #hist a:hover { color: #f4f6ff; border-color: var(--border); background: rgba(38, 38, 38, .82); }
    #hist a .truncate { overflow: hidden; color: #d8deec; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    #hist a .text-\[11px\] { margin-top: 4px; color: var(--subtle) !important; font-size: 10px; }
    .sidebar-footer { padding-top: 13px; border-top: 1px solid var(--border); }
    .shutdown-button {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 11px; color: #8792a7;
      border: 1px solid transparent; border-radius: 9px; background: transparent; text-align: left; font-size: 11px; transition: .18s;
    }
    .shutdown-button:hover { color: #f0a0a8; border-color: rgba(239, 120, 133, .16); background: rgba(160, 53, 68, .09); }
    .shutdown-dot { width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; }

    .workspace { flex: 1; min-width: 0; padding: 35px clamp(22px, 4vw, 58px) 64px; }
    .workspace-inner { width: min(100%, 1120px); margin: 0 auto; }

    #progress {
      position: relative; overflow: hidden; margin-bottom: 22px; padding: 20px 22px;
      border: 1px solid var(--border); border-radius: 16px;
      background: linear-gradient(125deg, #151515, #0b0b0b); box-shadow: var(--shadow);
    }
    #progress::before { position: absolute; top: 0; left: 0; width: 100%; height: 2px; content: ''; background: linear-gradient(90deg, var(--accent-strong), var(--cyan), transparent 78%); }
    #ptitle { margin-bottom: 12px; color: #e8edff; font-size: 13px; font-weight: 700; }
    #plog { max-height: 260px; overflow-y: auto; color: #9eabc2; font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.75; white-space: pre-wrap; }

    #empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 390px; padding: 46px 24px;
      color: var(--muted); border: 1px dashed rgba(135, 151, 184, .24); border-radius: 20px;
      background: linear-gradient(145deg, rgba(18, 18, 18, .82), rgba(7, 7, 7, .76)); text-align: center; font-size: 12px; line-height: 1.7;
    }
    .empty-symbol { display: grid; place-items: center; width: 62px; height: 62px; margin-bottom: 18px; color: #a4afff; border: 1px solid rgba(143, 157, 255, .2); border-radius: 19px; background: rgba(125, 143, 255, .09); }
    .empty-symbol svg { width: 28px; height: 28px; }
    .empty-copy { max-width: 380px; color: #8793aa; }

    #report { animation: reveal .28s ease both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .report-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 25px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
    #meta { margin-bottom: 10px; color: #99a6ff; font-size: 10px; font-weight: 600; line-height: 1.7; letter-spacing: .25px; }
    #title { margin: 0; color: #f0f3fc; font-size: clamp(25px, 3vw, 36px); font-weight: 800; letter-spacing: -1.35px; line-height: 1.18; overflow-wrap: anywhere; }
    .report-actions { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; }
    .action-button {
      min-height: 37px; padding: 0 13px; color: #cbd4e8; border: 1px solid var(--border-strong); border-radius: 9px;
      background: rgba(22, 22, 22, .96); font-size: 12px; font-weight: 650; white-space: nowrap; transition: .18s;
    }
    .action-button:hover { color: #fff; border-color: rgba(142, 157, 255, .45); background: #292929; }
    .action-button.primary { color: white; border-color: rgba(145, 159, 255, .35); background: linear-gradient(110deg, #6378e8, #7778e7); }
    .action-button.primary:hover { filter: brightness(1.12); }
    .tabs { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 15px; }
    .tab {
      min-height: 36px; padding: 0 14px !important; color: #96a1b6 !important; border: 1px solid transparent !important;
      border-radius: 9px !important; background: transparent !important; font-size: 12px !important; font-weight: 650 !important; transition: .18s;
    }
    .tab:hover { color: #e8edfb !important; background: rgba(42, 42, 42, .72) !important; }
    .tab.bg-indigo-600 { color: #f7f8ff !important; border-color: rgba(145, 159, 255, .25) !important; background: rgba(112, 130, 255, .16) !important; box-shadow: inset 0 0 0 1px rgba(143, 157, 255, .04); }
    .tab.bg-slate-800 { color: #aab5c9 !important; background: rgba(30, 30, 30, .78) !important; }
    .pane { min-width: 0; }
    #t-rep {
      padding: clamp(22px, 3.6vw, 42px); color: #c7d0e2; border: 1px solid var(--border); border-radius: 17px;
      background: linear-gradient(145deg, #111111, #080808); box-shadow: 0 17px 48px rgba(0, 0, 0, .17);
      font-size: 16px; line-height: 1.85; overflow-wrap: anywhere;
    }
    #t-rep > :first-child { margin-top: 0; }
    #t-rep h1, #t-rep h2, #t-rep h3, #t-rep h4 { color: #edf1fc; font-weight: 750; letter-spacing: -.45px; line-height: 1.35; }
    #t-rep h1 { margin: 1.9em 0 .75em; font-size: 25px; }
    #t-rep h2 { margin: 1.8em 0 .7em; padding-bottom: 10px; border-bottom: 1px solid var(--border); font-size: 19px; }
    #t-rep h3 { margin: 1.55em 0 .55em; color: #c4ccff; font-size: 15px; }
    #t-rep p { margin: .8em 0; }
    #t-rep strong { color: #f0f3fc; font-weight: 700; }
    #t-rep a { color: #a5b1ff; text-decoration: underline; text-decoration-color: rgba(165, 177, 255, .35); text-underline-offset: 3px; }
    #t-rep a:hover { color: #d1d7ff; }
    #t-rep ul, #t-rep ol { padding-left: 1.55em; }
    #t-rep li { margin: .35em 0; padding-left: .2em; }
    #t-rep li::marker { color: #8e9dff; }
    #t-rep blockquote { margin: 1.2em 0; padding: 3px 0 3px 17px; color: #aeb9cd; border-left: 3px solid #7f8ff0; }
    #t-rep code { padding: .15em .38em; color: #b8c4ff; border: 1px solid rgba(143, 157, 255, .12); border-radius: 5px; background: rgba(115, 131, 255, .09); font-size: .9em; }
    #t-rep pre { overflow-x: auto; padding: 16px 18px; color: #c9d4eb; border: 1px solid var(--border); border-radius: 11px; background: #070707; }
    #t-rep pre code { padding: 0; color: inherit; border: 0; background: transparent; }
    #t-rep table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: 13px; }
    #t-rep th { color: #e8edfb; background: rgba(126, 143, 255, .1); font-weight: 700; text-align: left; }
    #t-rep th, #t-rep td { padding: 10px 12px; border: 1px solid var(--border-strong); }
    #t-rep tr:nth-child(even) td { background: rgba(255, 255, 255, .018); }
    #t-rep hr { margin: 2em 0; border: 0; border-top: 1px solid var(--border); }
    #t-src { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    #t-src a {
      display: block; min-width: 0; padding: 17px 18px; color: var(--text); border: 1px solid var(--border); border-radius: 13px;
      background: linear-gradient(145deg, #151515, #0a0a0a); text-decoration: none; transition: .18s;
    }
    #t-src a:hover { border-color: rgba(141, 156, 255, .38); background: #202020; transform: translateY(-2px); }
    #t-src a > div:first-child { margin-bottom: 8px; color: #9eacff !important; font-size: 9px; font-weight: 700; line-height: 1.5; }
    #t-src a > div:nth-child(2) { color: #e4eafa; font-size: 14px; font-weight: 700; line-height: 1.5; }
    #t-src a > div:nth-child(3) { margin-top: 7px; color: #8e9bb1 !important; font-size: 12px; line-height: 1.65; }
    #t-raw, #t-plan { max-height: 70vh; overflow: auto; padding: 20px; color: #b9c5db; border: 1px solid var(--border); border-radius: 14px; background: #0b0b0b; font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }

    @media (max-width: 900px) {
      .app-layout { display: block; }
      .sidebar { position: relative; width: 100%; height: auto; min-height: 0; padding: 18px 20px 14px; border-right: 0; border-bottom: 1px solid var(--border); }
      .brand-row { padding-bottom: 14px; }
      .config-panel { padding: 14px; }
      .history-heading { margin-top: 17px; }
      #hist { display: flex; gap: 6px; max-height: 130px; padding-bottom: 5px; }
      #hist a { flex: 0 0 210px; margin: 0; }
      .sidebar-footer { padding-top: 8px; }
      .shutdown-button { width: auto; }
      .workspace { padding-top: 25px; }
    }
    @media (max-width: 600px) {
      .workspace { padding: 20px 15px 42px; }
      .report-header { display: block; }
      .report-actions { margin-top: 16px; }
      #t-src { grid-template-columns: 1fr; }
      #t-rep { padding: 20px 17px; font-size: 16px; }
      #title { font-size: 27px; }
      #empty { min-height: 300px; }
    }
    @media print {
      body, html { color: #111 !important; background: #fff !important; }
      .sidebar, .workspace-topline, #progress, #empty, .report-actions, .tabs { display: none !important; }
      .app-layout, .workspace, .workspace-inner, #report { display: block !important; width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
      #meta { color: #555 !important; }
      #title, #t-rep, #t-rep h1, #t-rep h2, #t-rep h3, #t-rep strong { color: #111 !important; }
      #t-rep { padding: 0 !important; border: 0 !important; background: #fff !important; box-shadow: none !important; font-size: 10pt !important; }
      #t-rep a { color: #222 !important; }
      #t-rep pre, #t-rep code { color: #111 !important; background: #f3f3f3 !important; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5V6.5M4 17.5h6M10 17.5V11M10 11h6M16 11V6.5M16 6.5h4"/><circle cx="4" cy="6.5" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </div>
      <div>
        <div class="brand-name">last30days <span>Hub</span></div>
      </div>
    </div>
    <div id="health">API yapılandırması kontrol ediliyor...</div>

    <div class="config-panel">
      <input id="topic" placeholder="Arastirilacak konu..." autocomplete="off">
      <select id="mode"><option value="quick">Hızlı (600-900 kelime)</option><option value="normal">Normal (1.100-1.500 kelime)</option><option value="deep" selected>Derin (1.700-2.300 kelime)</option></select>
      <button id="go">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        Arastir
      </button>
    </div>

    <div class="history-heading">
      <div class="sidebar-label">Gecmis</div>
      <div class="history-tools">
        <span id="history-count" class="history-count-label">0 KAYIT</span>
        <button id="clear-history" class="history-clear-button" type="button" title="Araştırma geçmişini temizle" aria-label="Araştırma geçmişini temizle" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5h17M9 6.5V4h6v2.5m3 0-.8 13H6.8L6 6.5M10 10v6m4-6v6"/></svg>
          <span>Temizle</span>
        </button>
      </div>
    </div>
    <nav id="hist" aria-label="Araştırma geçmişi"></nav>

    <div class="sidebar-footer">
      <button onclick="fetch('/api/shutdown',{method:'POST',body:'{}'}).then(()=>document.body.innerHTML='<p class=p-10>Sunucu kapatildi. Pencereyi kapatabilirsin.</p>')" class="shutdown-button"><span class="shutdown-dot"></span>Sunucuyu kapat</button>
    </div>
  </aside>

  <main class="workspace">
    <div class="workspace-inner">
      <div id="progress" class="hidden">
        <div class="text-sm font-semibold mb-2" id="ptitle">Calisiyor...</div>
        <pre id="plog" class="text-xs max-h-64 overflow-y-auto whitespace-pre-wrap"></pre>
      </div>

      <div id="empty">
        <div class="empty-symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5M8 10.8h5.6M10.8 8v5.6"/></svg>
        </div>
        <div class="empty-copy">Soldan bir konu yaz ve Arastir'a bas, ya da gecmisten bir rapor sec.</div>
      </div>

      <div id="report" class="hidden">
        <div class="report-header">
          <div class="min-w-0">
            <div id="meta"></div>
            <h1 id="title"></h1>
          </div>
          <div class="report-actions">
            <button onclick="navigator.clipboard.writeText(CUR.md)" class="action-button">Markdown kopyala</button>
            <button onclick="window.print()" class="action-button primary">PDF / Yazdir</button>
          </div>
        </div>
        <div class="tabs">
          <button data-t="rep" class="tab px-3 py-1.5 rounded-lg">Rapor</button>
          <button data-t="src" class="tab px-3 py-1.5 rounded-lg">Kaynaklar</button>
          <button data-t="raw" class="tab px-3 py-1.5 rounded-lg">Repo ham cikti</button>
          <button data-t="plan" class="tab px-3 py-1.5 rounded-lg">Sorgu plani</button>
        </div>
        <article id="t-rep" class="pane prose prose-invert max-w-none"></article>
        <div id="t-src" class="pane hidden"></div>
        <pre id="t-raw" class="pane hidden"></pre>
        <pre id="t-plan" class="pane hidden"></pre>
      </div>
    </div>
  </main>
</div>
<script>
let CUR = null;
const $ = id => document.getElementById(id);
async function loadHealth(){
  try {
    const h = await (await fetch('/api/health')).json();
    const mark = v => v ? '✓' : '✕';
    $('health').textContent = 'Gemini key: '+mark(h.gemini_configured)+'  |  Brave key: '+mark(h.brave_configured)+'  |  Repo: '+mark(h.repo_found);
    $('health').className = 'mt-2 text-[11px] '+(h.gemini_configured && h.brave_configured && h.repo_found ? 'text-emerald-400' : 'text-amber-400');
  } catch(e) { $('health').textContent = 'API durumu okunamadı'; }
}
function tab(t){
  document.querySelectorAll('.pane').forEach(e=>e.classList.add('hidden'));
  $('t-'+t).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(b=>b.className='tab px-3 py-1.5 rounded-lg '+(b.dataset.t===t?'bg-indigo-600':'bg-slate-800'));
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.t));
async function loadHist(){
  const response = await fetch('/api/history');
  if (!response.ok) throw new Error('Geçmiş yüklenemedi.');
  const h = await response.json();
  $('hist').innerHTML='';
  $('history-count').textContent = h.length + ' KAYIT';
  $('clear-history').disabled = h.length === 0;
  if (!h.length) {
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = 'Henüz kayıtlı araştırma yok.';
    $('hist').appendChild(empty);
    return;
  }
  h.forEach(i=>{
    const a=document.createElement('a'); a.href='#'; a.className='block px-3 py-2 rounded-lg text-sm hover:bg-slate-800';
    const d1=document.createElement('div'); d1.className='truncate'; d1.textContent=i.topic;
    const d2=document.createElement('div'); d2.className='text-[11px] text-slate-500'; d2.textContent=i.created_at;
    a.append(d1,d2); a.onclick=e=>{e.preventDefault();show(i.id)}; $('hist').appendChild(a);
  });
}
async function clearHistory(){
  if (!confirm('Araştırma geçmişindeki tüm raporlar kalıcı olarak silinsin mi? Bu işlem geri alınamaz.')) return;
  const button = $('clear-history');
  button.disabled = true;
  try {
    const response = await fetch('/api/history/clear', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Geçmiş temizlenemedi.');
    await loadHist();
  } catch (error) {
    alert('Geçmiş temizlenemedi: ' + error.message);
    try { await loadHist(); } catch (_) { button.disabled = false; }
  }
}
$('clear-history').addEventListener('click', clearHistory);
async function show(id){
  CUR = await (await fetch('/api/report/'+id)).json();
  $('empty').classList.add('hidden'); $('report').classList.remove('hidden');
  $('title').textContent=CUR.topic;
  $('meta').textContent=CUR.start+' → '+CUR.end+' • model: '+CUR.model+' • '+CUR.cards.length+' kaynak • '+(CUR.word_count||CUR.md.trim().split(/\s+/).length)+' kelime • '+(CUR.plan_used?'Gemini planıyla':'repo yedek modu')+' • '+(CUR.mode||'normal')+(CUR.coverage?' • '+Object.entries(CUR.coverage).map(([k,v])=>k+':'+v).join(', '):'');
  $('t-rep').innerHTML=marked.parse(CUR.md);
  $('t-src').innerHTML='';
  CUR.cards.forEach(c=>{
    const a=document.createElement('a'); a.href=c.url; a.target='_blank'; a.rel='noopener noreferrer';
    a.className='block bg-slate-900/60 hover:bg-slate-900 border border-slate-800 rounded-xl p-3';
    const s=document.createElement('div'); s.className='text-xs text-indigo-400 mb-1'; s.textContent=c.source+' • '+c.date+' • puan '+c.score+' • yorum '+c.comments;
    const t=document.createElement('div'); t.className='text-sm font-semibold'; t.textContent=c.title;
    const n=document.createElement('div'); n.className='text-xs text-slate-400 mt-1'; n.textContent=c.snippet||'';
    a.append(s,t,n); $('t-src').appendChild(a);
  });
  $('t-raw').textContent=CUR.raw||'(bos)';
  $('t-plan').textContent=(CUR.plan?JSON.stringify(CUR.plan,null,2):'Plan uretilemedi.')+'\n\nKaynak hatalari:\n'+JSON.stringify(CUR.errors||{},null,2);
  tab('rep'); loadHist();
}
$('go').onclick=async()=>{
  const topic=$('topic').value.trim(); if(!topic) return;
  $('go').disabled=true; $('progress').classList.remove('hidden'); $('plog').textContent=''; $('ptitle').textContent='Calisiyor...';
  const {job}=await (await fetch('/api/start',{method:'POST',body:JSON.stringify({topic,mode:$('mode').value})})).json();
  const iv=setInterval(async()=>{
    const s=await (await fetch('/api/status/'+job)).json();
    $('plog').textContent=s.log.join('\n'); $('plog').scrollTop=1e9;
    if(s.state!=='running'){
      clearInterval(iv); $('go').disabled=false;
      if(s.state==='done'){ $('ptitle').textContent='Bitti'; show(s.report_id); }
      else $('ptitle').textContent='Hata: '+s.error;
    }
  },1500);
};
$('topic').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
loadHist();
loadHealth();
</script>
</body>
